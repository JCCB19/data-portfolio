name: weekly-update

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC = 06:00 hora de CDMX
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para que el bot pueda guardar los datos nuevos

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos nuevos
        run: python -m pipelines.ingest_football

      - name: Reconstruir warehouse y marts
        run: python -m pipelines.build_warehouse

      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: actualización semanal de datos"
          git push
